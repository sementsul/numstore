<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Красивые номера</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>Красивые номера</h1>
      <p class="sub">Собери маску — найдём подходящие номера</p>
    </div>
  </header>

  <main class="wrap">
    <section class="search-box">
      <div class="cubes" id="cubes" aria-label="Маска номера из 10 цифр">
        <span class="cube-prefix">+7</span>
        <!-- 10 ячеек добавит JS -->
      </div>
      <div class="cube-actions">
        <button id="find" class="btn-primary">Найти</button>
        <button id="reset" class="btn-ghost">Сбросить</button>
      </div>
      <p class="cube-hint">Цифра — точная позиция · пусто — любая · буква (a, b, …) — повторяющаяся цифра</p>
      <div class="ref-bar" id="refBar" hidden>
        <input id="refLink" class="ref-link" readonly>
        <button id="copyLink" class="btn-ghost">Копировать</button>
        <a id="openStore" class="btn-primary" target="_blank" rel="noopener">Открыть в магазине</a>
      </div>
    </section>

    <section class="controls">
      <select id="tariff"><option value="">Все тарифы</option></select>
      <select id="sort">
        <option value="default">Сортировка</option>
        <option value="price-asc">Цена тарифа ↑</option>
        <option value="price-desc">Цена тарифа ↓</option>
      </select>
      <span id="count" class="count"></span>
    </section>

    <div id="status" class="status">Загружаю номера…</div>
    <div id="grid"></div>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p>Информационная витрина. Подключение и оплата — на стороне оператора.</p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
