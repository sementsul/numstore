name: temp catprobe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: raw
        run: |
          T="Basic YXBpU3RvcmU6VkZ6WFdOSmhwNTVtc3JmQXV1dU0zVHBtcnFTRw=="
          B="https://api.store.bezlimit.ru/v2/super-link/phones"
          echo "===FILTERS==="
          curl -s -m 30 -H "Authorization: $T" "$B/filters" | head -c 1500
          echo; echo "===CATEGORIES=brilliant==="
          curl -s -m 40 -H "Authorization: $T" "$B/mask-category?expand=tariff&is_reserved=false&per_page=2&phone_pattern=9NNNNNNNNN&categories=brilliant" | head -c 900
          echo; echo "===mask_categories=brilliant==="
          curl -s -m 40 -H "Authorization: $T" "$B/mask-category?expand=tariff&is_reserved=false&per_page=2&phone_pattern=9NNNNNNNNN&mask_categories=brilliant" | head -c 400
          echo; echo "===DONE==="
