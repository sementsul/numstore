name: Предзагрузка каталога (прогрев номеров)

# API Безлимит медленный (~11с). Крон заранее тянет до 250 номеров каждой категории в статику
# data/catalog.json → лендинг/каталог грузятся мгновенно с CDN. Наличие проверяется при брони в браузере.
# Пуш под DEPLOY_TOKEN (как price_history) — заодно сбрасывает 60-дневный таймер scheduled-воркфлоу.

on:
  schedule:
    - cron: "41 * * * *"     # каждый час
  workflow_dispatch: {}

concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Собрать каталог (до 250 номеров/категория)
        run: python3 collect_catalog.py data/catalog.json
      - name: Сохранить в numstore (источник; пуш под PAT — крон не «засыпает»)
        env:
          TOK: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain data/catalog.json)" ]; then
            git config user.name "catalog-bot"
            git config user.email "catalog-bot@users.noreply.github.com"
            git add data/catalog.json
            git commit -m "chore: прогрев каталога номеров"
            # устойчивость к гонке: подтягиваем чужие пуши (keepalive/ручные) перед push
            git pull --rebase -X ours "https://x-access-token:${TOK}@github.com/sementsul/numstore.git" main || true
            git push "https://x-access-token:${TOK}@github.com/sementsul/numstore.git" HEAD:main
          else
            echo "каталог без изменений"
          fi
      - name: Пересобрать главную (свежий SSR) + опубликовать в magzgold
        env:
          TOK: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # build.py регенерит dist/index.html со свежими 9 SSR-номерами из свежего catalog.json
          # (тот же render_home, без дублирования). pillow нужен для og-картинок в build.py.
          pip install --quiet pillow || pip3 install --quiet pillow
          python3 build.py
          git clone --depth 1 "https://x-access-token:${TOK}@github.com/sementsul/magzgold.git" site
          mkdir -p site/data
          cp data/catalog.json site/data/catalog.json      # свежие данные (для JS-витрины)
          cp dist/index.html   site/index.html             # свежий SSR главной (для роботов)
          cd site
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "catalog-bot"
            git config user.email "catalog-bot@users.noreply.github.com"
            git add data/catalog.json index.html
            git commit -m "chore: авто-обновление catalog.json + SSR главной"
            git push
          else
            echo "на сайте без изменений"
          fi
