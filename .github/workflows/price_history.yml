name: История цен по категориям

on:
  schedule:
    - cron: "17 3 * * *"     # ежедневно ~03:17 UTC
  workflow_dispatch: {}

concurrency:
  group: price-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать точку истории (средняя абонплата по категориям)
        run: python3 collect_prices.py data/price_history.json
      - name: Сохранить историю в numstore (источник правды; пуш под PAT — чтобы крон не «засыпал» через 60 дней)
        env:
          TOK: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain data/price_history.json)" ]; then
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add data/price_history.json
            git commit -m "chore: точка истории цен"
            # ВАЖНО: пуш под персональным токеном (PAT), а не GITHUB_TOKEN — только так пуш считается
            # активностью репозитория и сбрасывает 60-дневный таймер авто-отключения scheduled-воркфлоу.
            git push "https://x-access-token:${TOK}@github.com/sementsul/numstore.git" HEAD:main
          else
            echo "история не изменилась"
          fi
      - name: Опубликовать на сайт (magzgold)
        env:
          TOK: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOK}@github.com/sementsul/magzgold.git" site
          mkdir -p site/data
          cp data/price_history.json site/data/price_history.json
          cd site
          if [ -n "$(git status --porcelain data/price_history.json)" ]; then
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add data/price_history.json
            git commit -m "chore: авто-обновление price_history.json"
            git push
          else
            echo "на сайте без изменений"
          fi
