name: temp getchatid
on: workflow_dispatch
permissions:
  contents: read
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - name: getUpdates → chat_id
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${TG}/getUpdates" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          if not d.get('ok'):
              print('getUpdates НЕ ок (возможно установлен webhook):', json.dumps(d)[:200]); raise SystemExit(0)
          seen=set()
          for u in d.get('result',[]):
              m=u.get('message') or u.get('my_chat_member') or {}
              ch=(m.get('chat') or {})
              cid=ch.get('id')
              if cid and cid not in seen:
                  seen.add(cid)
                  print('FOUND chat_id=%s type=%s name=%s @%s' % (cid, ch.get('type'), ch.get('first_name',''), ch.get('username','')))
          if not seen: print('нет апдейтов — сделай /start боту numstore ещё раз и повтори')
          "
