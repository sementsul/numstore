name: Автопостинг статей в Blogger

on:
  schedule:
    - cron: "0 9 * * *"      # ежедневно 09:00 UTC; скрипт сам держит интервал 10 дней
  workflow_dispatch: {}

permissions:
  contents: write            # коммитить blog_state.json обратно

concurrency:
  group: blog-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Пост в Blogger (если пора)
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python3 blog_post.py
      - name: Сохранить состояние очереди
        run: |
          if [ -n "$(git status --porcelain blog_state.json)" ]; then
            git config user.name "blog-bot"
            git config user.email "blog-bot@users.noreply.github.com"
            git add blog_state.json
            git commit -m "chore: blog_state — опубликована статья"
            git push
          else
            echo "состояние не менялось"
          fi
