name: temp apiprobe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проба API Безлимит из CI (с браузерными заголовками)
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          TOKEN="Basic YXBpU3RvcmU6VkZ6WFdOSmhwNTVtc3JmQXV1dU0zVHBtcnFTRw=="
          URL="https://api.store.bezlimit.ru/v2/super-link/phones/mask-category?expand=tariff&is_reserved=false&per_page=5&phone_pattern=9NNNNNNNNN&mask_categories=brilliant,brilliant_super"
          echo "=== без спец-заголовков ==="
          curl -s -m 20 -o /dev/null -w "HTTP %{http_code} · %{time_total}s · %{size_download}b\n" -H "Authorization: $TOKEN" "$URL" || echo "curl fail"
          echo "=== с браузерными заголовками ==="
          curl -s -m 20 -o /tmp/r.json -w "HTTP %{http_code} · %{time_total}s · %{size_download}b\n" \
            -H "Authorization: $TOKEN" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36" \
            -H "Origin: https://l.bezlimit.ru" -H "Referer: https://l.bezlimit.ru/" -H "Accept: application/json" \
            "$URL" || echo "curl fail"
          echo "первые 160 символов:"; head -c 160 /tmp/r.json 2>/dev/null; echo
